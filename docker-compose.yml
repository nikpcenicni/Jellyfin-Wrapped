services:
  jellyfin-wrapped:
    # Replace 'your-username' with your GitHub username or Docker Hub username
    # Option 1: Use GitHub Container Registry (recommended)
    # image: ghcr.io/your-username/jellyfin-wrapped:latest
    # Option 2: Use Docker Hub (uncomment and comment out Option 1)
    image: nikpcenicni/jellyfin-wrapped:latest
    ports:
      - "3000:80"
    environment:
      - JELLYFIN_SERVER_URL=${JELLYFIN_SERVER_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
